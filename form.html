<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        /* Modern styling for the container */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        /* Styling inputs, labels, and textareas */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            resize: vertical; /* Allows only vertical resizing for textareas */
        }

        /* Submit button styling */
        button[type="submit"] {
            width: 100%;
            background-color: #04AA6D;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button[type="submit"]:hover {
            background-color: #038a58;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Contact Us</h2>
        <form action="/submit-form" method="POST">
            <label for="fname">Full Name</label>
            <input type="text" id="fname" name="fullname" placeholder="Your name.." required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Your email.." required>

            <label for="subject">Message</label>
            <textarea id="subject" name="message" placeholder="Write something.." style="height:100px"></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

</body>
</html>
